# Tag-triggered direct distribution. Does nothing useful until every Apple secret below
# is set. A partial set fails the job. No Sparkle step: re-download the latest DMG.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        id: gate
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          present=0
          missing=0
          for value in "$P12" "$P12_PASSWORD" "$IDENTITY" "$KEY_ID" "$ISSUER" "$P8"; do
            if [[ -n "$value" ]]; then present=1; else missing=1; fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple signing secrets are configured, so this tag was not signed or published."
            exit 0
          fi
          if [[ "$missing" -eq 1 ]]; then
            echo "Set all of the Apple signing secrets, or none of them." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Stamp the version from the tag
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a version. Use v1.2.3." >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${tag}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${tag}" Resources/Info.plist

      - name: Import the Developer ID certificate
        if: steps.gate.outputs.ready == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/screenclip-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Write the notarization key
        if: steps.gate.outputs.ready == 'true'
        env:
          P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Release
        if: steps.gate.outputs.ready == 'true'
        env:
          SCREENCLIP_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/build.sh release CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO OTHER_CODE_SIGN_FLAGS=--timestamp

      - name: Notarize, staple, and package the DMG
        if: steps.gate.outputs.ready == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/release-dmg.sh

      - name: Publish the GitHub Release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: build
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="ScreenClip ${tag#v}"
          notes="Notarized macOS download. Requires macOS 14 or later.

          Verify the disk image:

          \`\`\`
          shasum -a 256 -c SHA256SUMS
          \`\`\`

          Open it and drag ScreenClip to Applications."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ScreenClip.dmg SHA256SUMS --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" ScreenClip.dmg SHA256SUMS --title "$title" --notes "$notes"
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/screenclip-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
